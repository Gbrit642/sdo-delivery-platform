[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdo-adk-engine"
version = "0.1.0"
description = "Wallbox SDO Platform on Google Cloud Platform (ADK 2.0 Engine)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.18.0",
    "google-cloud-trace>=1.11.0",
    "google-cloud-logging>=3.9.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-exporter-gcp-logging>=1.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "sqlfluff>=3.0.0",
    "jinja2>=3.1.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "gateway*", "registry*", "graphs*", "agents*", "harnesses*", "tools*", "storage*", "observability*", "eval*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
